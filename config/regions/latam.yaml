# Ciclo Latinoamérica: B3 (Brasil) y Bolsa Mexicana.
# Región propia y no parte de Américas: cierran más tarde que Wall Street y las fuentes
# de noticias por ticker buscan el símbolo como si fuera estadounidense.
id: latam
name: Latinoamérica
enabled: true

markets:
  - { mic: BVMF, calendar: BVMF, currency: BRL }   # B3, São Paulo
  - { mic: XMEX, calendar: XMEX, currency: MXN }   # Bolsa Mexicana de Valores

schedule:
  run_at: "07:00"                  # B3 cierra a las 22:00-23:00 y la BMV a las 23:00 (hora peninsular)
  execute_at: next_open
  reevaluation_gate: null

universe:
  id: latam_large_cap
  constituents_file: latam_large_cap_pit.parquet  # en data/universe/latam/
  min_avg_volume_20: 500_000

providers:
  prices: yfinance                 # .SA y .MX en Yahoo
  prices_fallback: eodhd           # rescata lo que Yahoo deje sin la vela del día (cupo diario compartido)
  fundamentals: null
  macro: null
  news: []

news:
  language: multi
  strategy: technical_only         # prensa en portugués y castellano; sin traducción, solo reglas técnicas

rules:
  - oversold_uptrend
