# Ciclo EE. UU. sobre el catálogo de Quantfury: todo lo negociable en NYSE y NASDAQ
# (acciones y ETF). Sustituye a "americas" (S&P 500), que queda desactivada: las dos
# darían señal sobre los mismos valores y la clave de señal no lleva región.
id: quantfury_us
name: EE. UU. (Quantfury)
enabled: true

markets:
  - { mic: XNYS, calendar: XNYS, currency: USD }   # NYSE (el bróker incluye aquí los ETF de NYSE Arca)
  - { mic: XNAS, calendar: XNAS, currency: USD }   # NASDAQ

schedule:
  run_at: "06:30"                  # tras el cierre USA (22:00); la señal se ejecuta en la apertura de las 15:30
  execute_at: next_open
  reevaluation_gate: null

universe:
  id: quantfury_us
  constituents_file: quantfury_us_pit.parquet     # en data/universe/quantfury_us/
  min_avg_volume_20: 500_000       # más bajo que el S&P 500 (1M): el catálogo trae medianas y ETF

providers:
  prices: yfinance
  fundamentals: sec_edgar
  macro: fred
  news: [yahoo_finance_rss, finnhub, cnbc_rss]

news:
  language: en
  strategy: native

rules:
  - oversold_uptrend
