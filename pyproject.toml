# ---------------------------------------------------------------------------
# market-analyzer
#
# Instalación:
#   uv sync                         -> núcleo (datos, reglas, backtest)
#   uv sync --extra nlp             -> + deduplicación por embeddings y FinBERT
#   uv sync --extra orchestration   -> + Prefect para el flujo de 12 pasos
#   uv sync --all-extras            -> todo
#
# Los grupos opcionales existen para que la instalación base no arrastre
# torch (varios GB). El pipeline funciona sin ellos: el nivel 2 de dedup
# y el sentimiento se desactivan y se opera solo con reglas técnicas.
# ---------------------------------------------------------------------------

[project]
name = "market-analyzer"
version = "0.1.0"
description = "Screener de mercados multi-región con reglas deterministas y capa LLM mínima"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Joan Martorell Coll" }]

dependencies = [
    # --- datos y cálculo --------------------------------------------------
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=16.0",             # Parquet
    "duckdb>=1.1",
    "pandas-ta>=0.3.14b0",
    "vectorbt>=0.26",

    # --- ingesta ----------------------------------------------------------
    "yfinance>=0.2.40",
    "httpx>=0.27",               # SEC EDGAR, FRED, Finnhub, EODHD, Telegram
    "feedparser>=6.0",           # RSS de noticias
    "exchange-calendars>=4.5",   # calendarios de ~50 bolsas
    "datasketch>=1.6",           # MinHash / LSH (nivel 1 de dedup, sin ML)
    "lxml>=5.0",                 # pandas.read_html (constituyentes desde Wikipedia)

    # --- configuración y modelos ------------------------------------------
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",

    # --- LLM --------------------------------------------------------------
    "anthropic>=1.0",

    # --- CLI y utilidades -------------------------------------------------
    "typer>=0.12",
    "structlog>=24.1",
    "tenacity>=8.3",             # reintentos en descargas
]

[project.optional-dependencies]
nlp = [
    "sentence-transformers>=3.0",   # all-MiniLM-L6-v2, nivel 2 de dedup
    "transformers>=4.40",           # FinBERT (ProsusAI/finbert)
    "torch>=2.2",
    "scikit-learn>=1.4",            # DBSCAN
]
orchestration = [
    "prefect>=3.0",
]

[project.scripts]
analyzer = "core.cli:app"

# ---------------------------------------------------------------------------
# Dependencias de desarrollo (uv las instala siempre salvo --no-dev)
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",         # tests del parser de reglas
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core", "src/delivery", "src/analyzer"]

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
# Torch solo CPU: el modelo de embeddings y FinBERT corren en CPU de sobra.
# Evita descargar las ruedas CUDA (>2 GB).
index = [
    { name = "pytorch-cpu", url = "https://download.pytorch.org/whl/cpu", explicit = true },
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# ---------------------------------------------------------------------------
# Ruff: lint + formato
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "N",         # pep8-naming
    "S",         # bandit: detecta eval(), exec(), yaml.load sin Loader...
    "PD",        # pandas-vet
    "NPY",       # numpy
    "RUF",
]
ignore = [
    "S101",      # assert en tests es correcto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PD"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "pandas_ta.*",
    "vectorbt.*",
    "yfinance.*",
    "feedparser.*",
    "datasketch.*",
    "exchange_calendars.*",
    "sentence_transformers.*",
    "transformers.*",
    "sklearn.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: ejecuta el pipeline completo contra fixtures (lento)",
    "network: requiere acceso a APIs externas, excluido por defecto",
]
filterwarnings = [
    "ignore::DeprecationWarning:pandas_ta.*",
]

[tool.coverage.run]
source = ["core", "delivery", "analyzer"]
branch = true
